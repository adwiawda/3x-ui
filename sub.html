<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEOV2RAY | Subscription Service</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0c20;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* پس‌زمینه متحرک نئونی */
        .background-blobs {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            filter: blur(80px);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            animation: move 10s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 300px;
            height: 300px;
            background: #7928ca;
            top: 10%;
            left: 15%;
        }

        .blob-2 {
            width: 350px;
            height: 350px;
            background: #ff0080;
            bottom: 10%;
            right: 15%;
            animation-delay: -3s;
        }

        .blob-3 {
            width: 250px;
            height: 250px;
            background: #00dfd8;
            top: 40%;
            left: 50%;
            animation-delay: -6s;
        }

        @keyframes move {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, -40px) scale(1.2); }
            100% { transform: translate(-40px, 50px) scale(0.9); }
        }

        /* کارت شیشه‌ای اصلی */
        .card {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #7928ca, #ff0080);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 0 25px rgba(255, 0, 128, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 128, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(255, 0, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 128, 0); }
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00dfd8, #007cf0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 14px;
            color: #a0a0b8;
            margin-bottom: 24px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-copy {
            background: linear-gradient(90deg, #7928ca, #ff0080);
            color: white;
            box-shadow: 0 4px 15px rgba(121, 40, 202, 0.4);
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 128, 0.6);
        }

        .btn-telegram {
            background: #26a5e4;
            color: white;
            box-shadow: 0 4px 15px rgba(38, 165, 228, 0.3);
        }

        .btn-telegram:hover {
            background: #1d93d2;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(38, 165, 228, 0.5);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 223, 216, 0.9);
            color: #000;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="card">
        <div class="logo-box">
            <i class="fa-solid fa-bolt"></i>
        </div>
        <h1>MEOV2RAY VIP SUB</h1>
        <p>لینک اختصاصی اتصال شما با موفقیت آماده شد</p>

        <button class="btn btn-copy" onclick="copySubLink()">
            <i class="fa-regular fa-copy"></i>
            کپی کردن لینک ساب اسکریپشن
        </button>

        <a href="https://t.me/meov2ray" target="_blank" class="btn btn-telegram">
            <i class="fa-brands fa-telegram"></i>
            عضویت در کانال تلگرام MEOV2RAY
        </a>
    </div>

    <div id="toast" class="toast">لینک ساب اسکریپشن کپی شد! ✨</div>

    <script>
        function copySubLink() {
            const currentUrl = window.location.href;
            navigator.clipboard.writeText(currentUrl).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            });
        }
    </script>
</body>
</html>
